[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framesig"
version = "0.1.2"
description = "Detect on-screen events in any video by pixel signature — declarative YAML, cached scores, game-agnostic."
readme = "README.md"
# Version policy: this floor is a minimum, not a recommendation, and everything below 3.11 is
# compatibility rather than support. 0.2.0 raises the floor to 3.11 (3.10 reaches end of life in
# October 2026). Nothing changes within 0.1.x.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fernando Aporta Franco", email = "ferinazumaDEV@users.noreply.github.com" }]
keywords = [
    "computer-vision",
    "video",
    "event-detection",
    "opencv",
    "ffmpeg",
    "signal-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<6",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
framesig = "framesig.cli:main"

[project.urls]
Homepage = "https://github.com/ferinazumaDEV/framesig"
Source = "https://github.com/ferinazumaDEV/framesig"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
